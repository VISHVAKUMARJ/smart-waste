spring:
  application:
    name: smart-waste
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/smartwaste}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8080}
